<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>行址罗盘</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --ink:#e6ebf5; --dim:#8b97ad; --acc:#5aa9ff; --win:#41d18a; --warn:#f5b945; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 22px; background:linear-gradient(90deg,#142033,#0f1420); border-bottom:1px solid #24304a; display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:20px; margin:0; letter-spacing:2px; }
  header .sub { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; padding:0 18px; background:var(--panel); border-bottom:1px solid #24304a; }
  nav button { background:none; border:none; color:var(--dim); padding:12px 16px; cursor:pointer; font-size:14px; border-bottom:2px solid transparent; }
  nav button.active { color:var(--acc); border-bottom-color:var(--acc); }
  main { padding:18px 22px; }
  .card { background:var(--panel); border:1px solid #24304a; border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--acc); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #202a3e; vertical-align:top; }
  th { color:var(--dim); font-weight:600; }
  code,.mono { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
  .addr { color:#9fd0ff; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; }
  .b-win { background:rgba(65,209,138,.18); color:var(--win); }
  .b-warn { background:rgba(245,185,69,.18); color:var(--warn); }
  .b-err { background:rgba(255,107,107,.18); color:var(--err); }
  .b-info { background:rgba(90,169,255,.18); color:var(--acc); }
  textarea,input,select { width:100%; background:#0d1322; color:var(--ink); border:1px solid #2a3752; border-radius:6px; padding:8px; font-size:13px; }
  textarea { min-height:110px; font-family:ui-monospace,Menlo,monospace; }
  button.act { background:var(--acc); color:#08111f; border:none; border-radius:6px; padding:8px 16px; font-weight:600; cursor:pointer; }
  button.ghost { background:#22304b; color:var(--ink); border:none; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .section-map { display:flex; height:26px; border-radius:5px; overflow:hidden; border:1px solid #2a3752; }
  .section-map div { display:flex; align-items:center; justify-content:center; font-size:10px; color:#07101e; overflow:hidden; }
  .tree { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.7; }
  .tree .ind { color:var(--dim); }
  .muted { color:var(--dim); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .pill { font-size:11px; padding:1px 6px; border:1px solid #33456a; border-radius:8px; color:var(--dim); }
  .filelink { color:var(--acc); cursor:pointer; text-decoration:underline; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>行址罗盘</h1>
  <span class="sub">ELF / DWARF4 · DWARF5 本地地址溯源 — load bias · CU · line sequence · 内联调用链 · 候选排序</span>
</header>
<nav id="tabs">
  <button data-tab="compass" class="active">罗盘查询</button>
  <button data-tab="files">调试文件版本</button>
  <button data-tab="detail">Section / 范围 / Line / 内联树</button>
  <button data-tab="snapshots">模块加载快照</button>
  <button data-tab="crashes">崩溃记录</button>
</nav>
<main id="view"></main>
<script src="/app.js"></script>
</body>
</html>
